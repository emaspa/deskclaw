[package]
name = "deskclaw"
version = "0.3.2"
edition = "2021"

[lib]
name = "deskclaw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.10", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

tokio = { version = "1", features = ["full"] }

russh = { version = "0.61", default-features = false, features = ["flate2", "ring", "rsa"] } # ring instead of aws-lc-rs (no cmake needed)


tokio-tungstenite = "0.29"
futures-util = "0.3"

ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
aes-gcm = "0.10"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

uuid = { version = "1", features = ["v4"] }
zeroize = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
tauri-winrt-notification = "0.7"

[target.'cfg(not(windows))'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "linux")'.dependencies]
# Webview mic permission handling for voice input (WebKitGTK denies
# getUserMedia by default). Version pinned to match wry's.
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
